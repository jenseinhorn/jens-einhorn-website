backend:
  name: turbo-github
  repo: jenseinhorn/jens-einhorn-website
  turbo_site_id: e71ee10b-6103-4cc6-b96c-64192c4501d2
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"
publish_mode: simple

collections:
  - label: "Projekte"
    name: "projects"
    files:
      - label: "REISE OHNE ENDE"
        name: "reise_ohne_ende"
        file: "content/projects/reise-ohne-ende.json"
        format: "json"
        fields: &project_fields
          - { label: "Menütitel", name: "menu_title", widget: "string", hint: "So erscheint das Projekt links im Menü." }
          - { label: "Seitentitel", name: "title", widget: "string" }
          - label: "Arbeiten"
            label_singular: "Arbeit"
            name: "works"
            widget: "list"
            summary: "{{fields.title}} — {{fields.year}}"
            add_to_top: true
            collapsed: true
            hint: "Neue Arbeit hinzufügen. Die Reihenfolge kann per Ziehen verändert werden."
            fields:
              - { label: "Bild", name: "image", widget: "image", choose_url: true }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Jahr", name: "year", widget: "string", required: false }
              - { label: "Material / Technik", name: "material", widget: "text", required: false }
              - { label: "Maße", name: "size", widget: "string", required: false, hint: "Zum Beispiel: 50 × 60 cm" }
          - { label: "Projekttext", name: "text", widget: "text", required: false, hint: "Absätze durch eine Leerzeile trennen." }
          - { label: "Hinweis / Ausstellung / Übersetzung", name: "note", widget: "text", required: false }
          - label: "Ausstellungsansichten"
            label_singular: "Ausstellungsansicht"
            name: "installation_views"
            widget: "list"
            required: false
            summary: "{{fields.caption}}"
            collapsed: true
            fields:
              - { label: "Bild", name: "image", widget: "image", choose_url: true }
              - { label: "Bildunterschrift", name: "caption", widget: "string", required: false }

      - label: "WORN OUT TAPES"
        name: "worn_out_tapes"
        file: "content/projects/worn-out-tapes.json"
        format: "json"
        fields: *project_fields

      - label: "PORCELAIN & VOLCANO"
        name: "porcelain_volcano"
        file: "content/projects/porcelain-volcano.json"
        format: "json"
        fields: *project_fields

      - label: "FOR THE BIRDS"
        name: "for_the_birds"
        file: "content/projects/for-the-birds.json"
        format: "json"
        fields: *project_fields

      - label: "WE ARE ALL WE HAVE"
        name: "we_are_all_we_have"
        file: "content/projects/we-are-all-we-have.json"
        format: "json"
        fields: *project_fields

  - label: "Seiten"
    name: "pages"
    files:
      - label: "ABOUT"
        name: "about"
        file: "content/pages/about.json"
        format: "json"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "text", hint: "Absätze durch eine Leerzeile trennen." }

      - label: "CONTACT"
        name: "contact"
        file: "content/pages/contact.json"
        format: "json"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "E-Mail", name: "email", widget: "string" }
          - { label: "Zusätzlicher Text", name: "body", widget: "text", required: false }
