<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Website bearbeiten | Jens Einhorn</title>
</head>
<body>
<script>window.CMS_MANUAL_INIT = true;</script>
<script src="https://cdn.jsdelivr.net/npm/decap-cms@3.17.0-beta.0/dist/decap-cms.js"></script>
<script>
const workFields = [
  { label: "Bild", name: "image", widget: "image", choose_url: true, hint: "Bild hochladen oder vorhandenes Bild auswählen." },
  { label: "Titel", name: "title", widget: "string", hint: "Nur der Werktitel, ohne Jahr." },
  { label: "Jahr", name: "year", widget: "string", required: false },
  { label: "Material / Technik", name: "material", widget: "text", required: false },
  { label: "Maße", name: "size", widget: "string", required: false, hint: "Zum Beispiel: 50 × 60 cm" }
];

const projectFields = [
  { label: "Menütitel", name: "menu_title", widget: "string", hint: "So erscheint das Projekt links im Menü." },
  { label: "Seitentitel", name: "title", widget: "string" },
  {
    label: "Arbeiten",
    label_singular: "Arbeit",
    name: "works",
    widget: "list",
    summary: "{{fields.title}} — {{fields.year}}",
    add_to_top: true,
    collapsed: true,
    hint: "Neue Arbeit hinzufügen. Die Reihenfolge der Arbeiten kann per Ziehen verändert werden.",
    fields: workFields
  },
  { label: "Projekttext", name: "text", widget: "text", required: false, hint: "Absätze durch eine Leerzeile trennen." },
  { label: "Hinweis / Ausstellung / Übersetzung", name: "note", widget: "text", required: false },
  {
    label: "Ausstellungsansichten",
    label_singular: "Ausstellungsansicht",
    name: "installation_views",
    widget: "list",
    required: false,
    summary: "{{fields.caption}}",
    add_to_top: false,
    collapsed: true,
    hint: "Zusätzliche Installations- oder Ausstellungsfotos am Ende der Projektseite.",
    fields: [
      { label: "Bild", name: "image", widget: "image", choose_url: true },
      { label: "Bildunterschrift", name: "caption", widget: "string", required: false }
    ]
  }
];

CMS.init({
  config: {
    backend: {
      name: "turbo-github",
      repo: "jenseinhorn/jens-einhorn-website",
      turbo_site_id: "e71ee10b-6103-4cc6-b96c-64192c4501d2",
      branch: "main"
    },
    media_folder: "assets/uploads",
    public_folder: "/assets/uploads",
    publish_mode: "simple",
    collections: [
      {
        label: "Design / Einstellungen",
        name: "design",
        files: [
          {
            label: "Schriften & Bildgröße",
            name: "design_settings",
            file: "content/settings/design.json",
            format: "json",
            fields: [
              { label: "Überschrift – Schriftart", name: "heading_font", widget: "select", options: [
                { label: "Roboto Bold", value: "\"Roboto\", Arial, Helvetica, sans-serif" },
                { label: "Arial", value: "Arial, Helvetica, sans-serif" },
                { label: "Helvetica", value: "\"Helvetica Neue\", Helvetica, Arial, sans-serif" },
                { label: "Arial Narrow", value: "\"Arial Narrow\", Arial, sans-serif" },
                { label: "Georgia", value: "Georgia, serif" },
                { label: "Times", value: "\"Times New Roman\", Times, serif" }
              ]},
              { label: "Überschrift – Schriftgröße (px)", name: "heading_size", widget: "number", min: 18, max: 80, step: 1, value_type: "int" },
              { label: "Menü – Schriftart", name: "menu_font", widget: "select", options: [
                { label: "Roboto Condensed Light", value: "\"Roboto Condensed\", \"Arial Narrow\", Arial, sans-serif" },
                { label: "DIN Next Light", value: "\"DIN Next\", \"DIN Next W01 Light\", \"Arial Narrow\", \"Helvetica Neue\", Arial, sans-serif" },
                { label: "Arial Narrow", value: "\"Arial Narrow\", \"Helvetica Neue\", Arial, sans-serif" },
                { label: "Arial", value: "Arial, Helvetica, sans-serif" },
                { label: "Helvetica", value: "\"Helvetica Neue\", Helvetica, Arial, sans-serif" },
                { label: "Georgia", value: "Georgia, serif" },
                { label: "Times", value: "\"Times New Roman\", Times, serif" }
              ]},
              { label: "Menü – Schriftgröße (px)", name: "menu_size", widget: "number", min: 10, max: 40, step: 1, value_type: "int" },
              { label: "Abstand Überschrift → Menü (px)", name: "heading_menu_gap", widget: "number", min: 0, max: 250, step: 1, value_type: "int" },
              { label: "Bildbreite (px)", name: "image_width", widget: "number", min: 500, max: 1600, step: 10, value_type: "int" },
              { label: "Bildunterschrift – Schriftart", name: "caption_font", widget: "select", options: [
                { label: "Roboto Thin", value: "\"Roboto\", Arial, Helvetica, sans-serif" },
                { label: "Arial", value: "Arial, Helvetica, sans-serif" },
                { label: "Helvetica", value: "\"Helvetica Neue\", Helvetica, Arial, sans-serif" },
                { label: "Arial Narrow", value: "\"Arial Narrow\", Arial, sans-serif" },
                { label: "Georgia", value: "Georgia, serif" },
                { label: "Times", value: "\"Times New Roman\", Times, serif" }
              ]},
              { label: "Bildunterschrift – Schriftgröße (px)", name: "caption_size", widget: "number", min: 8, max: 24, step: 1, value_type: "int" },
              { label: "Fließtext – Schriftart", name: "body_font", widget: "select", options: [
                { label: "Roboto Thin", value: "\"Roboto\", Arial, Helvetica, sans-serif" },
                { label: "Arial", value: "Arial, Helvetica, sans-serif" },
                { label: "Helvetica", value: "\"Helvetica Neue\", Helvetica, Arial, sans-serif" },
                { label: "Georgia", value: "Georgia, serif" },
                { label: "Times", value: "\"Times New Roman\", Times, serif" }
              ]}
            ]
          }
        ]
      },
      {
        label: "Projekte",
        name: "projects",
        files: [
          { label: "REISE OHNE ENDE", name: "reise_ohne_ende", file: "content/projects/reise-ohne-ende.json", format: "json", fields: projectFields },
          { label: "WORN OUT TAPES", name: "worn_out_tapes", file: "content/projects/worn-out-tapes.json", format: "json", fields: projectFields },
          { label: "PORCELAIN & VOLCANO", name: "porcelain_volcano", file: "content/projects/porcelain-volcano.json", format: "json", fields: projectFields },
          { label: "FOR THE BIRDS", name: "for_the_birds", file: "content/projects/for-the-birds.json", format: "json", fields: projectFields },
          { label: "WE ARE ALL WE HAVE", name: "we_are_all_we_have", file: "content/projects/we-are-all-we-have.json", format: "json", fields: projectFields }
        ]
      },
      {
        label: "Seiten",
        name: "pages",
        files: [
          {
            label: "ABOUT",
            name: "about",
            file: "content/pages/about.json",
            format: "json",
            fields: [
              { label: "Titel", name: "title", widget: "string" },
              { label: "Text", name: "body", widget: "text", hint: "Absätze durch eine Leerzeile trennen." }
            ]
          },
          {
            label: "CONTACT",
            name: "contact",
            file: "content/pages/contact.json",
            format: "json",
            fields: [
              { label: "Titel", name: "title", widget: "string" },
              { label: "E-Mail", name: "email", widget: "string" },
              { label: "Zusätzlicher Text", name: "body", widget: "text", required: false }
            ]
          }
        ]
      }
    ]
  }
});
</script>
</body>
</html>
